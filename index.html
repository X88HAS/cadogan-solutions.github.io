<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadogan Solutions</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
      color: white;
      text-align: center;
    }
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: centre;
      align-items: centre;
      padding: 0 1rem;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.2rem;
      max-width: 600px;
    }
    .cta-button {
      margin-top: 2rem;
      padding: 1rem 2rem;
      font-size: 1rem;
      background: #ff914d;
      colour: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .cta-button:hover {
      background: #e67e22;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Cadogan Solutions</h1>
    <p>Helping you grow with tailored recruitment and business insights.</p>
    <button class="cta-button" onclick="window.location.href='mailto:hello@cadogan-solutions.com'">Contact Us</button>
  </section>
</body>
</html>
